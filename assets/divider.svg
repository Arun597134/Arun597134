<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="50" y="11" width="900" height="2" fill="url(#d)"/>
  <circle cy="12" r="5" fill="#38bdf8">
    <animate attributeName="cx" values="50;950;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cy="12" r="10" fill="#38bdf8" opacity="0.2">
    <animate attributeName="cx" values="50;950;50" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
