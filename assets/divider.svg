  <g fill="#d97a1e"><circle cx="100" cy="15" r="4"/><circle cx="300" cy="15" r="4"/><circle cx="500" cy="15" r="6"/><circle cx="700" cy="15" r="4"/><circle cx="900" cy="15" r="4"/></g>
  <circle r="5" fill="#eaffee" filter="url(#g)" cy="15"><animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/></circle>
