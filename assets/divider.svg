<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path id="l" d="M0 15 H1000" stroke="#39ff6a" stroke-width="2" stroke-dasharray="14 8" fill="none" filter="url(#g)">
