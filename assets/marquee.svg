<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70">
  <defs>
    <clipPath id="c"><rect width="1000" height="70" rx="12"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0D1A" stop-opacity="1"/>
      <stop offset="0.08" stop-color="#0D0D1A" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#0D0D1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D0D1A" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
