          <rect x="370" y="18" width="110" height="34" rx="17" fill="#0c2a4a" stroke="#38bdf8"/><text x="425" y="40" fill="#bae6fd">React</text>
          <rect x="490" y="18" width="110" height="34" rx="17" fill="#0c2a4a" stroke="#38bdf8"/><text x="545" y="40" fill="#bae6fd">Node.js</text>
