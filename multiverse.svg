<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d97a1e" stroke-opacity=".07"/></pattern>
  </defs>
  <style>
    .m{font-family:'Courier New',monospace}
    .main{fill:none;stroke:#39ff6a;stroke-width:3;filter:url(#glow)}
    .br{fill:none;stroke:#39ff6a;stroke-width:2.5;stroke-dasharray:12 8;animation:f 2.5s linear infinite;filter:url(#glow)}
    .pr{fill:none;stroke:#d97a1e;stroke-width:1.5;stroke-dasharray:4 8;opacity:.5;animation:fade 4s ease-in-out infinite}
    @keyframes f{to{stroke-dashoffset:-200}}
    @keyframes fade{0%,100%{opacity:.1}50%{opacity:.6}}
    .ring{fill:none;stroke:#d97a1e;stroke-width:2;transform-origin:330px 190px;animation:ring 2.4s ease-out infinite}
    @keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
    .blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
  </style>
  <rect width="1000" height="380" fill="#080b08"/><rect width="1000" height="380" fill="url(#g)"/>
  <text x="500" y="34" text-anchor="middle" class="m" font-size="14" letter-spacing="8" fill="#d97a1e">THE MULTIVERSE OF ARUN M</text>
  <!-- pruned branches -->
  <path class="pr" d="M330 190 C420 190 440 20 560 20"/>
  <path class="pr" style="animation-delay:-1.3s" d="M330 190 C420 190 440 360 560 360"/>
  <path class="pr" style="animation-delay:-2.6s" d="M330 190 C400 190 420 135 560 135"/>
  <!-- sacred timeline -->
  <path id="sacred" class="main" d="M30 190 H330"/>
  <!-- variant branches -->
  <path id="b1" class="br" d="M330 190 C430 190 440 85 560 85 H720"/>
  <path id="b2" class="br" d="M330 190 H720"/>
  <path id="b3" class="br" d="M330 190 C430 190 440 295 560 295 H720"/>
  <circle class="ring" cx="330" cy="190" r="22"/>
  <circle cx="330" cy="190" r="9" fill="#d97a1e" filter="url(#glow)"/>
  <text x="330" y="236" text-anchor="middle" class="m blink" font-size="12" fill="#d97a1e">NEXUS EVENT</text>
  <text x="30" y="172" class="m" font-size="12" fill="#e8d8b0">SACRED TIMELINE</text>
  <text x="30" y="215" class="m" font-size="11" fill="#39ff6a">2023 · B.Tech begins</text>
  <!-- travelling pulses -->
  <circle r="5" fill="#eaffee" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#sacred"/></animateMotion></circle>
  <circle r="5" fill="#eaffee" filter="url(#glow)"><animateMotion dur="3.4s" begin="1s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle>
  <circle r="5" fill="#eaffee" filter="url(#glow)"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
  <circle r="5" fill="#eaffee" filter="url(#glow)"><animateMotion dur="3.4s" begin="2s" repeatCount="indefinite"><mpath href="#b3"/></animateMotion></circle>
  <!-- variant nodes -->
  <g class="m">
    <rect x="720" y="62" width="250" height="46" rx="6" fill="#0e140e" stroke="#39ff6a"/>
    <text x="735" y="82" font-size="15" fill="#e8d8b0" font-weight="bold">VARIANT: CivicFlow</text>
    <text x="735" y="100" font-size="11" fill="#39ff6a">AI civic complaints · Jan 2026</text>
    <rect x="720" y="167" width="250" height="46" rx="6" fill="#0e140e" stroke="#39ff6a"/>
    <text x="735" y="187" font-size="15" fill="#e8d8b0" font-weight="bold">VARIANT: ExamPortal</text>
    <text x="735" y="205" font-size="11" fill="#39ff6a">MERN + AI proctoring · Aug 2025</text>
    <rect x="720" y="272" width="250" height="46" rx="6" fill="#0e140e" stroke="#39ff6a"/>
    <text x="735" y="292" font-size="15" fill="#e8d8b0" font-weight="bold">VARIANT: HireWise</text>
    <text x="735" y="310" font-size="11" fill="#39ff6a">AI voice interviewer · Dec 2024</text>
  </g>
  <text x="500" y="366" text-anchor="middle" class="m" font-size="12" fill="#d97a1e" letter-spacing="3">⚠ UNAUTHORIZED BRANCHES DETECTED — PRUNING REQUEST REJECTED</text>
</svg>
